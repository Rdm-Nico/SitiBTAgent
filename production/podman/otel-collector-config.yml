receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:

exporters:
  # Esporta in formato Prometheus
  prometheus:
    endpoint: "0.0.0.0:8889"
    namespace: "otel"
    const_labels:
      collector: "opentelemetry"
  # Add your preferred backend exporters here
  # Examples: jaeger, prometheus, otlp, etc.

# Logging per debug
  logging:
    loglevel: info

service:
  pipelines:
    # Pipeline per le metriche
    metrics:
      receivers: [otlp]
      processors: [batch, resource]
      exporters: [prometheus, logging]
